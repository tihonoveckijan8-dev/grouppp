<script id="bandplan-boot-init">
try{
  var bpDoc=document.documentElement;
  var bpBoot=JSON.parse(localStorage.getItem('bandplan.boot')||'null');
  var bpStoredAccent=localStorage.getItem('accent')||'';
  var bpThemeIds=['light','dark','amoled'];
  var bpTheme=(bpBoot&&bpThemeIds.indexOf(bpBoot.theme)>=0)?bpBoot.theme:(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  var bpThemeColor={light:'#F4F6F8',dark:'#14161C',amoled:'#000000'}[bpTheme]||'#F4F6F8';
  var bpAccent=/^#[0-9a-fA-F]{6}$/.test(bpStoredAccent)?bpStoredAccent.toUpperCase():
    (/^#[0-9a-fA-F]{6}$/.test(bpBoot&&bpBoot.accent||'')?bpBoot.accent.toUpperCase():'#1554FF');
  function bpLum(hex){
    var n=parseInt(hex.slice(1),16),rgb=[n>>16&255,n>>8&255,n&255].map(function(v){v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)});
    return .2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2];
  }
  function bpContrast(a,b){var x=bpLum(a),y=bpLum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
  function bpOn(hex){return bpContrast(hex,'#FFFFFF')>=bpContrast(hex,'#000000')?'#FFFFFF':'#000000'}
  function bpOklch(hex){
    var n=parseInt(hex.slice(1),16),v=[n>>16&255,n>>8&255,n&255].map(function(x){x/=255;return x<=.04045?x/12.92:Math.pow((x+.055)/1.055,2.4)});
    var l=.4122214708*v[0]+.5363325363*v[1]+.0514459929*v[2],m=.2119034982*v[0]+.6806995451*v[1]+.1073969566*v[2],s=.0883024619*v[0]+.2817188376*v[1]+.6299787005*v[2];
    var l3=Math.cbrt(l),m3=Math.cbrt(m),s3=Math.cbrt(s),L=.2104542553*l3+.793617785*m3-.0040720468*s3,A=1.9779984951*l3-2.428592205*m3+.4505937099*s3,B=.0259040371*l3+.7827717662*m3-.808675766*s3;
    return {L:L,C:Math.hypot(A,B),H:Math.atan2(B,A)};
  }
  function bpOklchHex(L,C,H){
    var A=C*Math.cos(H),B=C*Math.sin(H),l3=L+.3963377774*A+.2158037573*B,m3=L-.1055613458*A-.0638541728*B,s3=L-.0894841775*A-1.291485548*B,l=l3**3,m=m3**3,s=s3**3;
    var rr=4.0767416621*l-3.3077115913*m+.2309699292*s,gg=-1.2684380046*l+2.6097574011*m-.3413193965*s,bb=-.0041960863*l-.7034186147*m+1.707614701*s;
    function ch(x){x=Math.max(0,Math.min(1,x));return Math.round(255*(x<=.0031308?12.92*x:1.055*Math.pow(x,1/2.4)-.055)).toString(16).padStart(2,'0')}
    return '#'+ch(rr)+ch(gg)+ch(bb);
  }
  function bpAccentOnBg(hex,bg){
    var o=bpOklch(hex),dir=bpLum(bg)>.179?-1:1;
    function ratio(L){return bpContrast(bpOklchHex(L,o.C,o.H),bg)}
    if(ratio(o.L)>=4.5)return bpOklchHex(o.L,o.C,o.H);
    var lo=dir<0?0:o.L,hi=dir<0?o.L:1;
    for(var i=0;i<40;i++){var mid=(lo+hi)/2;if(ratio(mid)>=4.5){if(dir<0)lo=mid;else hi=mid}else{if(dir<0)hi=mid;else lo=mid}}
    return bpOklchHex(dir<0?lo:hi,o.C,o.H);
  }
  var bpOnAccent=bpOn(bpAccent),bpOnBg=bpAccentOnBg(bpAccent,bpThemeColor);
  bpDoc.dataset.theme=bpTheme;
  bpDoc.style.setProperty('--accent',bpAccent);
  bpDoc.style.setProperty('--accent-contrast',bpOnAccent);
  bpDoc.style.setProperty('--accent-on-bg',bpOnBg);
  if(bpBoot&&bpBoot.density)bpDoc.dataset.density=bpBoot.density;
  document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.setAttribute('content',bpThemeColor)});
}catch(e){}
</script>
<style id="bandplan-auth-lock">html.bp-auth-required .app,html.bp-auth-required .bottom-nav{visibility:hidden!important;pointer-events:none!important}</style>
<style id="bandplan-boot-theme">
  html,body{background:var(--boot-bg,#F4F6F8);color:var(--boot-text,#111827)}
  body{min-height:100%;margin:0}
  .app{min-height:100vh}
  #view:empty::before{content:"BandPlan";display:block;padding:48px 32px;font:600 24px/1.2 system-ui,sans-serif;color:#1E232B;opacity:.72}
  html[data-theme="dark"]{background:#14161C;color:#ECEEF3}
  html[data-theme="dark"] body{background:#14161C;color:#ECEEF3}
  html[data-theme="amoled"]{background:#000;color:#F1F2F6}
  html[data-theme="amoled"] body{background:#000;color:#F1F2F6}
</style>
<style id="bandplan-boot-critical">@layer boot{
:root{--bb:#14161C;--bt:#F1F2F6;--bm:#98A2B3;--ba:#FFFFFF;--bo:#FFFFFF;--boot-bg:#14161C;--boot-text:#F1F2F6;--boot-muted:#98A2B3;--boot-track:#24262D}
html[data-theme=dark]{--bb:#14161C;--bt:#F1F2F6;--bm:#98A2B3;--boot-bg:#14161C;--boot-text:#F1F2F6;--boot-muted:#98A2B3;--boot-track:#24262D}
html[data-theme=amoled]{--bb:#000;--bt:#F1F2F6;--bm:#98A2B3;--boot-bg:#000;--boot-text:#F1F2F6;--boot-muted:#98A2B3;--boot-track:#15161A}
.boot{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;overflow:hidden;background:var(--bb);color:var(--bt);padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}
.boot.is-leaving{opacity:0;transform:scale(1.02);pointer-events:none}
.boot .box-mark{
  display:grid;
  place-items:center;
  width:100%;
  height:100%;
  font-family:Manrope,system-ui,sans-serif;
  font-size:34px;
  font-weight:900;
  letter-spacing:-2px;
  color:color-mix(in srgb,var(--accent,#1554FF) 68%,#000);
  text-shadow:
    1.5px 1.5px 2px color-mix(in srgb,#000 34%,transparent),
    -1.5px -1.5px 2px color-mix(in srgb,#fff 34%,transparent);
  user-select:none;
  pointer-events:none;
}
.boot .box{
  position:relative;
  width:100px;
  height:100px;
  flex:none;
  display:grid;
  place-items:center;
  background:var(--accent,#1554FF);
  border-radius:22px;
  box-shadow:
    12px 12px 24px color-mix(in srgb,#000 30%,transparent),
    -8px -8px 18px color-mix(in srgb,#fff 20%,transparent),
    inset 4px 4px 9px color-mix(in srgb,#000 20%,transparent),
    inset -4px -4px 9px color-mix(in srgb,#fff 28%,transparent);
  will-change:transform;
}
@media(max-width:480px){
  .boot .box{width:80px;height:80px;border-radius:18px}
  .boot .box-mark{font-size:28px}
}
@media(prefers-reduced-motion:reduce){
  .boot .box{transform:none!important}
}
@media(forced-colors:active){
  .boot .box{background:CanvasText;border:2px solid CanvasText}
}</style>

<div id="boot" class="boot" role="status" aria-live="polite" aria-label="Загрузка BandPlan">

    <aside class="boot-sidebar"><div class="boot-brand"><i></i><b></b></div><div class="boot-nav"><i></i><i></i><i></i><i></i><i></i></div></aside>

  </div>

</div>

<div class="app" id="app" inert aria-busy="true">
  <!-- ══ SIDEBAR (≥1024px) ══ -->
  <aside class="sidebar" aria-label="Основная навигация">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">BP</div>
      <div class="brand-txt">
        <div class="brand-name">BandPlan</div>
        <div class="brand-sub" id="brandBand">Моя группа</div>
      </div>
    </div>

    <nav class="nav" id="sideNav"></nav>

    <div class="side-profile" id="sideProfile"></div>

    <div class="sidebar-foot">
      <button class="btn btn-secondary btn-block" type="button" data-act="theme-toggle" id="themeQuick"></button>
      <button class="btn btn-primary btn-block" type="button" data-act="scene-quick" id="sceneQuick"></button>
    </div>
  </aside>

  <!-- ══ MAIN ══ -->
  <main class="main">
    <div class="page-head" id="pageHead"></div>
    <div class="content" id="view" tabindex="-1"></div>
  </main>
</div>

<!-- ══ BOTTOM NAV (mobile) ══ -->
<nav class="bottom-nav" id="botNav" aria-label="Навигация по разделам"></nav>

<!-- ══ SCENE ══ -->
<div class="scene" id="scene" role="dialog" aria-modal="true" aria-label="Сценический режим" aria-hidden="true">
  <div class="scene-top">
    <div class="scene-title"><h2 id="scTitle">—</h2><p id="scMeta"></p><div id="scPosition" class="scene-position" aria-live="polite"></div></div>
    <button class="sbtn" type="button" data-act="scene-close" aria-label="Закрыть сценический режим"></button>
  </div>
  <div class="scene-dyn" id="scDyn" aria-label="Динамика вашей партии"></div>
  <div class="scene-body" id="scBody" tabindex="0"></div>
  <div class="scene-bar" role="progressbar" aria-label="Прогресс программы"><i id="scBar"></i></div>
  <div class="scene-ctrl">
    <button class="sbtn" type="button" data-act="scene-prev" aria-label="Предыдущая песня"></button>
    <button class="sbtn" type="button" data-act="scene-auto" aria-label="Автопрокрутка"></button>
    <div class="sctl"><button type="button" data-act="scene-speed" data-d="-15" aria-label="Медленнее">−</button><span id="scSpeed">60</span><button type="button" data-act="scene-speed" data-d="15" aria-label="Быстрее">+</button></div>
    <div class="sctl"><button type="button" data-act="scene-font" data-d="-2" aria-label="Уменьшить шрифт">A−</button><span id="scFont">26</span><button type="button" data-act="scene-font" data-d="2" aria-label="Увеличить шрифт">A+</button></div>
    <div class="sctl"><button type="button" data-act="scene-trans" data-d="-1" aria-label="Транспонировать ниже">♭</button><span id="scTrans">0</span><button type="button" data-act="scene-trans" data-d="1" aria-label="Транспонировать выше">♯</button></div>
    <button class="sbtn" type="button" id="scChords" data-act="scene-chords" aria-pressed="true" aria-label="Показать или скрыть аккорды">Am</button>
    <button class="sbtn" type="button" data-act="scene-next" aria-label="Следующая песня"></button>
    <button class="sbtn" type="button" data-act="scene-fs" aria-label="Полноэкранный режим"></button>
  </div>
</div>

<!-- ══ ONBOARDING ══ -->
<div class="onb" id="onb" role="dialog" aria-modal="true" aria-label="Первоначальная настройка" aria-hidden="true"></div>

<div class="overlay" id="modalOverlay" role="presentation"></div>
<div class="toast-stack" id="toasts" role="region" aria-live="polite" aria-label="Уведомления"></div>
