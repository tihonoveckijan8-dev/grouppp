<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<meta name="theme-color" content="#F4F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161C" media="(prefers-color-scheme: dark)">
<script id="bandplan-boot-init">
try{
  var bpBoot=JSON.parse(localStorage.getItem('bandplan.boot')||'null'),bpDoc=document.documentElement;
  if(!bpBoot){try{for(var k=0;k<localStorage.length;k++){var key=localStorage.key(k)||'';if(key.indexOf('bandplan.premium.v6:')===0){var raw=JSON.parse(localStorage.getItem(key)||'null');if(raw&&raw.settings){bpBoot={theme:raw.settings.theme,accent:raw.settings.accent};break;}}}}catch(_e){}}
  var bpTheme=(bpBoot&&['light','dark','amoled'].includes(bpBoot.theme))?bpBoot.theme:(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  bpDoc.dataset.theme=bpTheme;
  if(bpBoot&&/^#[0-9a-fA-F]{6}$/.test(bpBoot.accent||'')){bpDoc.style.setProperty('--accent',bpBoot.accent);bpDoc.style.setProperty('--on-accent',bpBoot.onAccent||'#fff');}
  if(bpBoot&&bpBoot.density)bpDoc.dataset.density=bpBoot.density;
  var bpColor={light:'#F4F6F8',dark:'#14161C',amoled:'#000000'}[bpTheme]||'#F4F6F8';
  document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.setAttribute('content',bpColor)});
}catch(e){}
</script>
<style id="bandplan-auth-lock">html.bp-auth-required .app,html.bp-auth-required .bottom-nav{visibility:hidden!important;pointer-events:none!important}</style>
<style id="bandplan-boot-theme">
  html,body{background:#F4F6F8;color:#111827}
  body{min-height:100%;margin:0}
  .app{min-height:100vh}
  #view:empty::before{content:"BandPlan";display:block;padding:48px 32px;font:600 24px/1.2 system-ui,sans-serif;color:#1E232B;opacity:.72}
  @media(prefers-color-scheme:dark){
    html[data-theme="dark"],html[data-theme="amoled"]{background:#14161C;color:#ECEEF3}
    html[data-theme="dark"] body{background:#14161C;color:#ECEEF3}
    html[data-theme="amoled"] body{background:#000;color:#F1F2F6}
  }
</style>
<style id="bandplan-boot-critical">@layer boot{
:root{--bb:#F4F6F8;--bt:#111827;--bm:#667085;--ba:#2547D0;--bo:#fff}html[data-theme=dark]{--bb:#14161C;--bt:#ECEEF3;--bm:#98A2B3}html[data-theme=amoled]{--bb:#000;--bt:#F1F2F6;--bm:#98A2B3}
.boot{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;overflow:hidden;background:var(--bb);color:var(--bt);padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));font:14px system-ui,sans-serif}.boot.is-leaving{opacity:0;transform:scale(1.02);pointer-events:none}.boot-core{display:flex;flex-direction:column;align-items:center;gap:clamp(12px,3vmin,24px);text-align:center}.boot-mark{position:relative;width:clamp(72px,18vmin,128px);aspect-ratio:1;display:grid;place-items:center;border-radius:24px;background:var(--accent,var(--ba));color:var(--on-accent,var(--bo));font-weight:800;font-size:clamp(22px,5.5vmin,38px)}
.boot-ring{position:absolute;inset:-12%;width:124%;height:124%}.boot-ring circle{fill:none;stroke:var(--accent,var(--ba));stroke-width:2.5;stroke-linecap:round}.boot-ring .r0{opacity:.28}.boot-ring .r1{stroke-dasharray:70 220;animation:boot-spin 1.8s linear infinite;transform-origin:50% 50%}.boot-eq{display:flex;align-items:flex-end;gap:clamp(3px,.8vmin,5px);height:clamp(20px,5vmin,36px)}.boot-eq i{width:clamp(4px,1vmin,6px);height:100%;border-radius:99px;background:var(--accent,var(--ba));transform-origin:bottom;animation:boot-eq 1.2s ease-in-out infinite}.boot-eq i:nth-child(2){animation-delay:-.2s}.boot-eq i:nth-child(3){animation-delay:-.5s}.boot-eq i:nth-child(4){animation-delay:-.8s}.boot-eq i:nth-child(5){animation-delay:-1s}.boot-name{font-size:clamp(20px,5vmin,28px);font-weight:800}.boot-stage{color:var(--bm);min-height:20px;transition:opacity .16s}.boot-bar{width:clamp(160px,40vw,260px);height:4px;background:#EEF2F6;border-radius:99px;overflow:hidden}.boot-bar b{display:block;width:100%;height:100%;background:var(--accent,var(--ba));border-radius:inherit;transform:scaleX(.08);transform-origin:left;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
@keyframes boot-spin{to{transform:rotate(360deg)}}@keyframes boot-eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}@media(max-height:500px) and (orientation:landscape){.boot-core{flex-direction:row;gap:20px}.boot-eq{display:none}.boot-mark{width:clamp(64px,20vmin,88px)}.boot-name{font-size:22px}.boot-stage{display:none}}@media(max-height:360px){.boot-eq,.boot-stage,.boot-bar{display:none}.boot-name{font-size:20px}}@media(prefers-reduced-motion:reduce){.boot-ring .r1,.boot-eq i{animation:none}.boot-eq i:nth-child(odd){transform:scaleY(.55)}.boot-eq i:nth-child(even){transform:scaleY(.9)}.boot-bar b,.boot-stage{transition:none}}@media(forced-colors:active){.boot-mark{border:2px solid CanvasText;background:Canvas;color:CanvasText;box-shadow:none}.boot-eq i,.boot-bar b{background:Highlight}.boot-bar{border:1px solid CanvasText}}@media(prefers-contrast:more){.boot-stage{color:var(--bt)}.boot-bar{border:1px solid var(--bt)}}
}</style>
<meta name="description" content="BandPlan — операционная система музыкального коллектива: расписание, репертуар с аккордами и динамикой партий, сет-листы и сценический режим. Работает офлайн.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>BandPlan — Music Group OS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/manrope@latest/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/manrope@latest/latin-600-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/manrope@latest/cyrillic-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/manrope@latest/cyrillic-600-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/manrope@latest/latin-700-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/manrope@latest/cyrillic-700-normal.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="application-name" content="BandPlan">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BandPlan">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="bandplan.css?v=20261005-01">
</head>
<body data-route="calendar">
<div id="boot" class="boot" role="status" aria-live="polite" aria-label="Загрузка BandPlan">
  <div class="boot-core">
    <div class="boot-mark" aria-hidden="true"><svg class="boot-ring" viewBox="0 0 100 100"><circle class="r0" cx="50" cy="50" r="46"/><circle class="r1" cx="50" cy="50" r="46"/></svg><span>BP</span></div>
    <div class="boot-eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="boot-name">BandPlan</div>
    <div class="boot-stage" id="bootStage">Запускаем BandPlan</div>
    <div class="boot-bar" aria-hidden="true"><b id="bootBar"></b></div>
    <div class="boot-slow" id="bootSlow" hidden><p>Подключение занимает дольше обычного</p><div class="boot-acts"><button type="button" id="bootOffline">Продолжить офлайн</button><button type="button" id="bootRetry">Повторить</button></div></div>
  </div>
  <div class="boot-foot">Music Group OS</div>
</div>

<a class="skip-link" href="#view">Перейти к содержимому</a>

<div class="app" id="app" inert aria-busy="true">
  <!-- ══ SIDEBAR (≥1024px) ══ -->
  <aside class="sidebar" aria-label="Основная навигация">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">BP</div>
      <div class="brand-txt">
        <div class="brand-name">BandPlan</div>
        <div class="brand-sub" id="brandBand">Моя группа</div>
      </div>
    </div>

    <nav class="nav" id="sideNav"></nav>

    <div class="side-profile" id="sideProfile"></div>

    <div class="sidebar-foot">
      <button class="btn btn-secondary btn-block" type="button" data-act="theme-toggle" id="themeQuick"></button>
      <button class="btn btn-primary btn-block" type="button" data-act="scene-quick" id="sceneQuick"></button>
    </div>
  </aside>

  <!-- ══ MAIN ══ -->
  <main class="main">
    <header class="topbar" id="topbar">
      <div class="tb-inner">
        <div class="tb-search" id="searchWrap">
          <span class="tb-search-ic" id="searchIco" aria-hidden="true"></span>
          <label class="sr-only" for="globalSearch">Глобальный поиск по песням, событиям, сет-листам и участникам</label>
          <input id="globalSearch" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"
                 role="combobox" aria-expanded="false" aria-controls="searchDrop" aria-autocomplete="list"
                 placeholder="Поиск: песни, события, сет-листы, участники">
          <kbd class="tb-kbd">Ctrl K</kbd>
          <button class="tb-clear" type="button" id="searchClear" data-act="search-clear" aria-label="Очистить поиск"></button>
          <div class="search-drop" id="searchDrop" role="listbox" aria-label="Результаты поиска"></div>
        </div>

        <div class="tb-tools">
          <div class="sync-status" id="syncStatus" role="status" aria-live="polite" hidden></div>
          <button class="icon-btn" type="button" data-act="theme-toggle" id="tbTheme" aria-label="Переключить тему"></button>
          <button class="icon-btn" type="button" data-act="nav" data-to="settings" id="tbCust" aria-label="Оформление и настройки"></button>
          <button class="avatar-btn" type="button" id="tbAvatar" data-act="nav" data-to="settings" aria-label="Профиль и состав группы"></button>
          <button class="icon-btn" type="button" data-act="account-logout" aria-label="Выйти из аккаунта" title="Выйти из аккаунта">↪</button>
        </div>
      </div>
      <div class="netbar" id="netBar" role="status" hidden></div>
    </header>

    <div class="page-head" id="pageHead"></div>
    <div class="content" id="view" tabindex="-1"></div>
  </main>
</div>

<!-- ══ BOTTOM NAV (mobile) ══ -->
<nav class="bottom-nav" id="botNav" aria-label="Навигация по разделам"></nav>

<!-- ══ SCENE ══ -->
<div class="scene" id="scene" role="dialog" aria-modal="true" aria-label="Сценический режим" aria-hidden="true">
  <div class="scene-top">
    <button class="sbtn" type="button" data-act="scene-prev" aria-label="Предыдущая песня"></button>
    <div class="scene-title"><h2 id="scTitle">—</h2><p id="scMeta"></p></div>
    <button class="sbtn" type="button" data-act="scene-close" aria-label="Закрыть сценический режим"></button>
  </div>
  <div class="scene-dyn" id="scDyn" aria-label="Динамика вашей партии"></div>
  <div class="scene-body" id="scBody" tabindex="0"></div>
  <div class="scene-bar" role="progressbar" aria-label="Прогресс программы"><i id="scBar"></i></div>
  <div class="scene-ctrl">
    <button class="sbtn" type="button" data-act="scene-auto" aria-label="Автопрокрутка"></button>
    <div class="sctl"><button type="button" data-act="scene-speed" data-d="-15" aria-label="Медленнее">−</button><span id="scSpeed">60</span><button type="button" data-act="scene-speed" data-d="15" aria-label="Быстрее">+</button></div>
    <div class="sctl"><button type="button" data-act="scene-font" data-d="-2" aria-label="Уменьшить шрифт">A−</button><span id="scFont">26</span><button type="button" data-act="scene-font" data-d="2" aria-label="Увеличить шрифт">A+</button></div>
    <div class="sctl"><button type="button" data-act="scene-trans" data-d="-1" aria-label="Транспонировать ниже">♭</button><span id="scTrans">0</span><button type="button" data-act="scene-trans" data-d="1" aria-label="Транспонировать выше">♯</button></div>
    <button class="sbtn" type="button" id="scChords" data-act="scene-chords" aria-pressed="true" aria-label="Показать или скрыть аккорды">Am</button>
    <button class="sbtn" type="button" data-act="scene-next" aria-label="Следующая песня"></button>
    <button class="sbtn" type="button" data-act="scene-fs" aria-label="Полноэкранный режим"></button>
  </div>
</div>

<!-- ══ ONBOARDING ══ -->
<div class="onb" id="onb" role="dialog" aria-modal="true" aria-label="Первоначальная настройка" aria-hidden="true"></div>

<div class="overlay" id="modalOverlay" role="presentation"></div>
<div class="toast-stack" id="toasts" role="region" aria-live="polite" aria-label="Уведомления"></div>
<div class="print-area" id="printArea"></div>
<input type="file" id="fileIn" accept="application/json,.json" hidden>
<noscript><div class="noscript" role="alert"><strong>BandPlan</strong><p>Для работы приложения необходим JavaScript.</p></div></noscript>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js'"></script>
<script src="supabase.js?v=20261005-07"></script>
<script src="bandplan.js?v=20261005-08"></script>
</body>
</html>
