<script id="bandplan-boot-init">
try{
  var bpBoot=JSON.parse(localStorage.getItem('bandplan.boot')||'null'),bpDoc=document.documentElement;
  if(!bpBoot){try{for(var k=0;k<localStorage.length;k++){var key=localStorage.key(k)||'';if(key.indexOf('bandplan.premium.v6:')===0){var raw=JSON.parse(localStorage.getItem(key)||'null');if(raw&&raw.settings){bpBoot={theme:raw.settings.theme,accent:raw.settings.accent,accentApplied:raw.settings.accentApplied,onAccent:raw.settings.onAccent};break;}}}}catch(_e){}}
  var bpThemeIds=['light','dark','amoled'];
  var bpTheme=(bpBoot&&bpThemeIds.indexOf(bpBoot.theme)>=0)?bpBoot.theme:(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  var bpThemeColor={light:'#F4F6F8',dark:'#14161C',amoled:'#000000'}[bpTheme]||'#F4F6F8';
  var bpAccent=/^#[0-9a-fA-F]{6}$/.test(bpBoot&&bpBoot.accentApplied||'')?(bpBoot.accentApplied):(bpBoot&&/^#[0-9a-fA-F]{6}$/.test(bpBoot.accent||'')?bpBoot.accent:'#1554FF');
  function bpLum(hex){
    var n=parseInt(hex.slice(1),16),rgb=[n>>16&255,n>>8&255,n&255].map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
    return .2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2];
  }
  function bpContrast(a,b){var x=bpLum(a),y=bpLum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
  function bpShade(hex,amount){
    var n=parseInt(hex.slice(1),16),f=function(v){return Math.max(0,Math.min(255,Math.round(amount<0?v*(1+amount):v+(255-v)*amount)))};
    return '#'+[f(n>>16&255),f(n>>8&255),f(n&255)].map(function(v){return v.toString(16).padStart(2,'0')}).join('');
  }
  function bpOn(hex){return bpContrast(hex,'#FFFFFF')>=bpContrast(hex,'#111827')?'#FFFFFF':'#111827'}
  var bpCandidates=[bpAccent],bpBase=bpAccent,bpBg=bpThemeColor;
  for(var bi=1;bi<=24;bi++){var ba=bi*.035;bpCandidates.push(bpShade(bpBase,ba),bpShade(bpBase,-ba))}
  var bpBest=bpCandidates[0],bpBestScore=-Infinity;
  bpCandidates.forEach(function(candidate,idx){
    var on=bpOn(candidate),textRatio=bpContrast(candidate,on),bgRatio=bpContrast(candidate,bpBg);
    if(textRatio>=4.5&&bgRatio>=3){
      var score=Math.min(textRatio/4.5,bgRatio/3)-Math.abs(bpContrast(candidate,bpBase)-1)*.015-idx*.0001;
      if(score>bpBestScore){bpBestScore=score;bpBest=candidate}
    }
  });
  if(bpBestScore===-Infinity){
    bpCandidates.forEach(function(candidate,idx){
      var on=bpOn(candidate),score=bpContrast(candidate,on);
      if(score>bpBestScore){bpBestScore=score;bpBest=candidate}
    });
  }
  var bpOnAccent=bpOn(bpBest);
  bpAccent=bpBest;
  bpDoc.dataset.theme=bpTheme;
  bpDoc.style.setProperty('--accent',bpAccent);
  bpDoc.style.setProperty('--on-accent',bpOnAccent);
  if(bpBoot&&bpBoot.density)bpDoc.dataset.density=bpBoot.density;
  document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.setAttribute('content',bpThemeColor)});
}catch(e){}
</script>

<style id="bandplan-boot-theme">
  html,body{background:var(--boot-bg,#F4F6F8);color:var(--boot-text,#111827)}
  body{min-height:100%;margin:0}
  .app{min-height:100vh}
  #view:empty::before{content:"BandPlan";display:block;padding:48px 32px;font:600 24px/1.2 system-ui,sans-serif;color:#1E232B;opacity:.72}
  html[data-theme="dark"]{background:#14161C;color:#ECEEF3}
  html[data-theme="dark"] body{background:#14161C;color:#ECEEF3}
  html[data-theme="amoled"]{background:#000;color:#F1F2F6}
  html[data-theme="amoled"] body{background:#000;color:#F1F2F6}
</style>
<style id="bandplan-boot-critical">@layer boot{
:root{--bb:#14161C;--bt:#F1F2F6;--bm:#98A2B3;--ba:#FFFFFF;--bo:#FFFFFF;--boot-bg:#14161C;--boot-text:#F1F2F6;--boot-muted:#98A2B3;--boot-track:#24262D}
html[data-theme=dark]{--bb:#14161C;--bt:#F1F2F6;--bm:#98A2B3;--boot-bg:#14161C;--boot-text:#F1F2F6;--boot-muted:#98A2B3;--boot-track:#24262D}
html[data-theme=amoled]{--bb:#000;--bt:#F1F2F6;--bm:#98A2B3;--boot-bg:#000;--boot-text:#F1F2F6;--boot-muted:#98A2B3;--boot-track:#15161A}
.boot{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;overflow:hidden;background:var(--bb);color:var(--bt);padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));font:14px system-ui,sans-serif}
.boot.is-leaving{opacity:0;transform:scale(1.02);pointer-events:none}
.boot-core{display:flex;flex-direction:column;align-items:center;gap:clamp(12px,3vmin,24px);text-align:center}
.boot-mark{position:relative;width:clamp(72px,18vmin,128px);aspect-ratio:1;display:grid;place-items:center;border-radius:24px;background:#F8F9FB;color:#101828;font-weight:800;font-size:clamp(22px,5.5vmin,38px);z-index:1}
.boot-mark > span{position:relative;z-index:3}
.boot-ring{position:absolute;inset:-13%;width:126%;height:126%;pointer-events:none;z-index:2;overflow:visible}
.boot-ring circle{fill:none;stroke:#F1F2F6;stroke-width:2.5;stroke-linecap:round}
.boot-ring .r0{opacity:.22}
.boot-ring .r1{stroke-dasharray:72 220;animation:boot-spin 1.5s linear infinite;transform-origin:50% 50%}
.boot-eq,.boot-bar{display:none!important}
.boot-name{font-size:clamp(20px,5vmin,28px);font-weight:800}
.boot-stage{color:var(--bm);min-height:20px;transition:opacity .16s}
@keyframes boot-spin{to{transform:rotate(360deg)}}
@media(max-height:500px) and (orientation:landscape){.boot-core{flex-direction:row;gap:20px}.boot-eq,.boot-bar{display:none!important}.boot-mark{width:clamp(64px,20vmin,88px)}.boot-name{font-size:22px}.boot-stage{display:none}}
@media(max-height:360px){.boot-stage{display:none}.boot-name{font-size:20px}}
@media(prefers-reduced-motion:reduce){.boot-ring .r1{animation:none}.boot-stage{transition:none}}
@media(forced-colors:active){.boot-mark{border:2px solid CanvasText;background:Canvas;color:CanvasText;box-shadow:none}}
@media(prefers-contrast:more){.boot-stage{color:var(--bt)}}
}</style>
