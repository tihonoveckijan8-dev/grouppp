name: BandPlan Production Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install build tool
        run: npm install --no-package-lock

      - name: Ensure self-hosted browser assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fonts vendor
          if [ ! -s vendor/supabase.min.js ]; then
            curl --fail --location --retry 3 --retry-delay 2               "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"               --output vendor/supabase.min.js
          fi
          curl --fail --location --retry 3 --retry-delay 2             "https://cdn.jsdelivr.net/fontsource/fonts/manrope:vf@5.3.0/latin-wght-normal.woff2"             --output fonts/manrope-latin-wght-normal.woff2
          curl --fail --location --retry 3 --retry-delay 2             "https://cdn.jsdelivr.net/fontsource/fonts/manrope:vf@5.3.0/cyrillic-wght-normal.woff2"             --output fonts/manrope-cyrillic-wght-normal.woff2
          test -s vendor/supabase.min.js
          test -s fonts/manrope-latin-wght-normal.woff2
          test -s fonts/manrope-cyrillic-wght-normal.woff2

      - name: Build production assets
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
