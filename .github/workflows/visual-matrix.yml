name: BandPlan Visual Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-matrix:
    # WHY: Playwright is pinned to 1.56.1; keep CI on Ubuntu 24.04 while browser compatibility is verified.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # WHY: separate viewport jobs prevent one slow viewport from holding the entire matrix hostage; each runner handles only its nine theme/accent cases.
      matrix:
        viewport: ['360x800', '390x844', '768x1024', '1280x800', '1920x1080']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install --no-package-lock
      - name: Build production
        run: npm run build
      - name: Install pinned Playwright
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        # WHY: GitHub-hosted Ubuntu runners already include the browser's system libraries; avoid a second apt/dependency install.
        run: npx playwright install chromium
      - name: Start static server
        run: |
          python3 -m http.server 4174 --directory dist > /tmp/bandplan-visual.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bandplan-visual.log
          exit 1
      - name: Run responsive visual matrix
        # WHY: each viewport job runs its nine theme/accent cases with bounded browser concurrency; all 45 combinations remain covered.
        run: npx playwright test tests/visual-matrix.spec.mjs --reporter=line --grep "${{ matrix.viewport }}" --workers=2
      - name: Upload screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandplan-visual-matrix-${{ matrix.viewport }}
          path: |
            test-results/
            /tmp/bandplan-visual.log
          if-no-files-found: ignore
