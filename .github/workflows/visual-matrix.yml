name: BandPlan Visual Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-matrix:
    # WHY: Playwright is pinned to 1.56.1; keep CI on Ubuntu 24.04 while ubuntu-latest migrates to Ubuntu 26 and browser install compatibility is verified.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install --no-package-lock
      - name: Build production
        run: npm run build
      - name: Install pinned Playwright
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4174 --directory dist > /tmp/bandplan-visual.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bandplan-visual.log
          exit 1
      - name: Run responsive visual matrix
        run: npx playwright test tests/visual-matrix.spec.mjs --reporter=line --workers=1
      - name: Upload screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandplan-visual-matrix
          path: |
            test-results/
            /tmp/bandplan-visual.log
          if-no-files-found: ignore
