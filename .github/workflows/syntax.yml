name: BandPlan syntax check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm install --no-package-lock
      - name: Build production app and offline BPM analyzer
        run: npm run build
      - name: Check JavaScript syntax
        run: |
          node --check supabase.js
          node --check bandplan.js
          node --check metronome-audio.js
          node --check scripts/audio-beat-entry.js
          node --check sw.js
          node --check bandplan-core.js
